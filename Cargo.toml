[package]
name = "silt-lua"
version = "0.3.0"
authors = ["MakeAvoy <auxnon@gmail.com>"]
repository = "https://github.com/auxnon/silt-lua"
license = "MIT"
edition = "2021"
keywords = ["lua", "interpreter", "language", "vm", "script"]
description = "A pure rust Lua interpreter and virtual machine"
categories = ["compilers", "config"]
exclude = [
    "./build-wasm.sh",
    "./.vscode/launch.json",
    "./wasm-tester/index.html",
]

[lib]
name = "silt_lua"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]
bench = false   # only benches/interpreter.rs is a benchmark target (avoids cargo 6313 warning)

[[bin]]
name = "silt"
path = "src/main.rs"
bench = false

[profile.release]
strip = true    # Automatically strip symbols from the binary.
opt-level = "z" # Optimize for size.
lto = true
panic = "abort"


[profile.wasm]
inherits = "release"

# Benchmarks want speed, not size (the release profile optimizes for size with `opt-level = "z"`).
# `cargo bench` uses this profile; normal `cargo test`/`cargo build` are unaffected.
[profile.bench]
opt-level = 3
lto = true

[[bench]]
name = "interpreter"
harness = false       # use Criterion's harness, not libtest
# NOTE: benches are NOT compiled or run by `cargo test`; they run only via `cargo bench`,
# which keeps them out of the normal CI path (see PLAN.md §8).

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["silt"  ]
silt = [
    "bang",
    "under-number",
    "global",
"implicit-return",
    "short-declare",
    "compound-assignment",
    # "vectors",
]
wasm=["wasm-bindgen", "serde", "serde-wasm-bindgen"]
under-number = []
bang = []
global = []
short-declare = []
implicit-return = []
# Luau-style compound assignment operators: += -= *= /= //= %= ^= ..=
compound-assignment = []
vectors = []
dev-out = []

[dependencies]
byteyarn = "0.5.1"
wasm-bindgen = {version= "0.2.103", optional=true }
serde = { version = "1.0.219", features = ["derive"], optional=true }
serde-wasm-bindgen = {version="0.6.5", optional=true}
gc-arena = {version= "0.5.3", features=["allocator-api2"] }
string-interner = "0.18.0"
colored = "3.0.0"
lending-iterator = "0.1.7"
# rustc-hash="1.1.0"
# ahash="0.8.3"

# Dev-dependencies are compiled only for tests/benches/examples — never for the library or a
# release build, so Criterion adds zero overhead to normal consumers of the crate.
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
