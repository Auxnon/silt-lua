[package]
name = "silt-cli"
version = "0.3.0"
authors = ["MakeAvoy <auxnon@gmail.com>"]
repository = "https://github.com/auxnon/silt-lua"
license = "MIT"
edition = "2021"
description = "The silt command: run Lua/silt scripts, an interactive REPL, and a language server"

[[bin]]
name = "silt"
path = "src/main.rs"
bench = false

[features]
default = ["lsp-server", "vector"]
# `silt lsp`: the JSON-RPC language server
lsp-server = ["silt-lua/lsp-server"]
# vec2/vec3/vec4 values
vector = ["silt-lua/vector"]

[dependencies]
# the REPL's highlighting, completion and multi-line checks use the `lsp` analysis API
silt-lua = { path = "..", version = "0.3.0", features = ["lsp"] }
reedline = "0.52.1"
nu-ansi-term = "0.50.3"
